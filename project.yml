name: LiteVPN
options:
  bundleIdPrefix: com.egemenince
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  TunnelKit:
    # v6.3.2 (commit f2c0fb0) 的本地副本, 剥离了 WireGuard 部分 —
    # 上游已归档且其依赖的 wireguard-apple 仓库已被删除, 远端引用不再可靠
    path: Vendor/tunnelkit

settings:
  base:
    DEVELOPMENT_TEAM: 99U7KZC748
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    ENABLE_HARDENED_RUNTIME: true

targets:
  LiteVPN:
    type: application
    platform: macOS
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: $(LITEVPN_APP_PROFILE)
    sources:
      - path: App
        excludes:
          - Assets.xcassets
          - Assets.xcassets/**
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LiteVPN
        CFBundleIconFile: AppIcon.icns
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        LSApplicationCategoryType: public.app-category.utilities
        NSSystemExtensionUsageDescription: "LiteVPN installs a network system extension to create and manage VPN tunnels."
        NSHumanReadableCopyright: "© 2026 云中江树"
    entitlements:
      path: App/LiteVPN.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider-systemextension
        com.apple.developer.system-extension.install: true
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.com.egemenince.LiteVPN
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.egemenince.LiteVPN
    dependencies:
      - target: LiteVPNTunnel
      - package: TunnelKit
        product: TunnelKit
      - package: TunnelKit
        product: TunnelKitOpenVPN
  LiteVPNTunnel:
    type: system-extension
    platform: macOS
    sources:
      - Tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.egemenince.LiteVPN.Tunnel
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: $(LITEVPN_TUNNEL_PROFILE)
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: LiteVPNTunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSystemExtensionUsageDescription: "LiteVPN uses this system extension to create and manage VPN tunnels."
        NetworkExtension:
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
          NEMachServiceName: 99U7KZC748.com.egemenince.LiteVPN.Tunnel
    entitlements:
      path: Tunnel/LiteVPNTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider-systemextension
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.com.egemenince.LiteVPN
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.egemenince.LiteVPN
    dependencies:
      - package: TunnelKit
        product: TunnelKitOpenVPNAppExtension
      - package: TunnelKit
        product: TunnelKitLZO

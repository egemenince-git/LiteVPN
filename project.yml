name: LiteVPN
options:
  bundleIdPrefix: com.egemenince
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  TunnelKit:
    # v6.3.2 local snapshot; its archived WireGuard implementation was removed.
    path: Vendor/tunnelkit
  WireGuardKit:
    path: Vendor/wireguard-apple

settings:
  base:
    DEVELOPMENT_TEAM: 99U7KZC748
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.7"
    CURRENT_PROJECT_VERSION: "10"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    ENABLE_HARDENED_RUNTIME: true

targets:
  LiteVPN:
    type: application
    platform: macOS
    settings:
      base:
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_TEMP_DIR)/$(CONFIGURATION)/LiteVPNTunnel.build/DerivedSources/WireGuardGoBridge
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: $(LITEVPN_APP_PROFILE)
    sources:
      - path: App
        excludes:
          - Assets.xcassets
          - Assets.xcassets/**
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LiteVPN
        CFBundleIconFile: AppIcon.icns
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        LSApplicationCategoryType: public.app-category.utilities
        NSSystemExtensionUsageDescription: "LiteVPN installs a network system extension to create and manage VPN tunnels."
        NSHumanReadableCopyright: "© 2026 云中江树"
    entitlements:
      path: App/LiteVPN.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider-systemextension
        com.apple.developer.system-extension.install: true
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.com.egemenince.LiteVPN
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.egemenince.LiteVPN
    dependencies:
      - target: LiteVPNTunnel
      - package: TunnelKit
        product: TunnelKit
      - package: TunnelKit
        product: TunnelKitOpenVPN
      - package: WireGuardKit
        product: WireGuardKit
  LiteVPNTunnel:
    type: system-extension
    platform: macOS
    sources:
      - Tunnel
      - Shared
    preBuildScripts:
      - name: Build WireGuard Go bridge
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          WG_SOURCE="$SRCROOT/Vendor/wireguard-apple/Sources/WireGuardKitGo"
          WG_OUTPUT="$DERIVED_FILE_DIR/WireGuardGoBridge"
          WG_TEMP="$DERIVED_FILE_DIR/WireGuardGoBridgeTemp"
          mkdir -p "$WG_OUTPUT" "$WG_TEMP"
          make -C "$WG_SOURCE" build \
            ARCHS="arm64 x86_64" \
            PLATFORM_NAME="$PLATFORM_NAME" \
            SDKROOT="$SDKROOT" \
            DEPLOYMENT_TARGET_CLANG_FLAG_NAME=mmacosx-version-min \
            DEPLOYMENT_TARGET_CLANG_ENV_NAME=MACOSX_DEPLOYMENT_TARGET \
            MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            CONFIGURATION_BUILD_DIR="$WG_OUTPUT" \
            CONFIGURATION_TEMP_DIR="$WG_TEMP"
    settings:
      base:
        LIBRARY_SEARCH_PATHS: $(inherited) $(DERIVED_FILE_DIR)/WireGuardGoBridge
        PRODUCT_BUNDLE_IDENTIFIER: com.egemenince.LiteVPN.Tunnel
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: $(LITEVPN_TUNNEL_PROFILE)
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundlePackageType: SYSX
        CFBundleDisplayName: LiteVPNTunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSystemExtensionUsageDescription: "LiteVPN uses this system extension to create and manage VPN tunnels."
        NetworkExtension:
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
          NEMachServiceName: 99U7KZC748.group.com.egemenince.LiteVPN.Tunnel
    entitlements:
      path: Tunnel/LiteVPNTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider-systemextension
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.com.egemenince.LiteVPN
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.egemenince.LiteVPN
    dependencies:
      - package: TunnelKit
        product: TunnelKitOpenVPNAppExtension
      - package: TunnelKit
        product: TunnelKitLZO
      - package: WireGuardKit
        product: WireGuardKit
